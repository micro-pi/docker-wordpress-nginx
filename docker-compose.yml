name: docker-wp-nginx-php-mariadb
services:
  nginx:
    build: ./nginx
    image: wp_nginx:latest
    container_name: wp_nginx
    ports:
      - ${NGINX_PORT}:80
    depends_on:
      - php
    volumes:
      # Mount the named volume as read-only for Nginx
      - app_code:/var/www/html:ro
    networks:
      - wp_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  php:
    build: ./php
    image: wp_php:latest
    container_name: wp_php
    depends_on:
      - db
    volumes:
      # Mount the named volume as read-write for PHP
      - app_code:/var/www/html:rw
    networks:
      - wp_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db:
    image: mariadb:11.0
    container_name: wp_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - 127.0.0.1:${DB_PORT}:3306
    volumes:
      - db_data:/var/lib/mysql
    command: --bind-address=0.0.0.0 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - wp_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  adminer:
    image: adminer:4.8.1
    container_name: wp_adminer
    depends_on:
      - db
    ports:
      - ${ADMINER_PORT}:8080
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - wp_net
    restart: unless-stopped

volumes:
  db_data:
  app_code:

networks:
  wp_net:
    driver: bridge
